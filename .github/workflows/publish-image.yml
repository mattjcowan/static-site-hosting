# Publishes the container images when a version tag is pushed:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# Two images, each for linux/amd64 and linux/arm64, pushed to Docker Hub and mirrored to
# GitHub's registry:
#
#   latest, 1.2.3, 1.2              runtime-functions: includes the .NET SDK, so functions work
#   slim,   1.2.3-slim, 1.2-slim    runtime: static hosting only, about a quarter of the size
#
# Only plain vMAJOR.MINOR.PATCH tags publish; anything else (v1.2.3-rc1, a branch push)
# does nothing. Needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token)
# as repository secrets; GitHub's registry uses the workflow's own token.

name: Publish image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write # push to ghcr.io

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      # One variant failing should not cancel the other halfway through its push.
      fail-fast: false
      matrix:
        include:
          - variant: full
            target: runtime-functions
            suffix: ''
            floating: latest
          - variant: slim
            target: runtime
            suffix: '-slim'
            floating: slim

    steps:
      - uses: actions/checkout@v7

      # Emulation for the arm64 image. The app itself is built natively (see the Dockerfile's
      # --platform=$BUILDPLATFORM); only the final image's few setup commands run emulated.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag without its v, as the server's version and that of the StaticSiteHost.Abstractions
      # it compiles functions against. Not the metadata step's version output, which carries the
      # variant's suffix (1.2.3-slim) and would make the two images report different versions.
      - name: Read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/mattjcowan/static-site-hosting
            ghcr.io/mattjcowan/static-site-hosting
          # "latest" and "slim" are set explicitly below, one per variant.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.suffix }}
            type=raw,value=${{ matrix.floating }}
          labels: |
            org.opencontainers.image.title=Static Site Host${{ matrix.variant == 'slim' && ' (slim)' || '' }}
            org.opencontainers.image.description=Drop a zip, pick a domain, and it is live: a self-hosted static site host${{ matrix.variant == 'slim' && '.' || ', with C# functions.' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          provenance: mode=max
          sbom: true
