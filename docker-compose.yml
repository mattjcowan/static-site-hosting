services:
  static-site-host:
    # The published image: `docker compose pull` fetches it. IMAGE_TAG=slim is the smaller
    # image that serves static sites only; latest also compiles functions.
    image: mattjcowan/static-site-hosting:${IMAGE_TAG:-latest}
    # Or build it from this checkout with `docker compose up --build`. Pair IMAGE_TARGET=runtime
    # with IMAGE_TAG=slim so a local build is named for what it is.
    build:
      context: .
      target: ${IMAGE_TARGET:-runtime-functions}
    container_name: static-site-host
    restart: unless-stopped

    # Publish on :80 in production so the hosted domains resolve without a port. With HTTPS in the
    # server (TLS_ENABLED=true), publish both: HTTP_PORT=80 and HTTPS_PORT=443. Let's Encrypt
    # checks port 80 only.
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-8443}:8443"

    environment:
      # Where the management UI answers. Leave empty and it answers on any hostname
      # that does not have a site published to it.
      SiteHosting__ManagementHosts__0: "${MANAGEMENT_HOST:-}"

      # Turn on only when a trusted reverse proxy sits in front — routing is driven by
      # the Host header, and X-Forwarded-Host would otherwise be spoofable.
      SiteHosting__TrustForwardedHeaders: "${TRUST_FORWARDED_HEADERS:-false}"

      # HTTPS in the server, with certificates from Let's Encrypt for every site and management
      # host. Leave it off when a proxy in front (Caddy, Railway, a Cloudflare Tunnel) ends HTTPS.
      # ACME_DIRECTORY=staging tries it out without Let's Encrypt's production rate limits.
      SiteHosting__Tls__Enabled: "${TLS_ENABLED:-false}"
      SiteHosting__Tls__AcmeEmail: "${ACME_EMAIL:-}"   # optional ACME account contact
      SiteHosting__Tls__AcmeDirectory: "${ACME_DIRECTORY:-production}"

      SiteHosting__MaxUploadBytes: "${MAX_UPLOAD_BYTES:-536870912}"
      SiteHosting__ReleasesToKeep: "${RELEASES_TO_KEEP:-3}"

      # The first administrator. Leave the password empty and one is generated on first
      # run, printed to the log and written to /data/config/bootstrap-password.txt.
      Bootstrap__Username: "${ADMIN_USERNAME:-admin}"
      Bootstrap__Password: "${ADMIN_PASSWORD:-}"
      Bootstrap__DisplayName: "${ADMIN_DISPLAY_NAME:-Administrator}"

      # Recovery switch for a forgotten password. When true, the administrator's password is
      # reset on every start — to ADMIN_PASSWORD, or to a newly generated one if that is
      # empty. Turn it on for one start, sign in, then set it back to false.
      Bootstrap__ResetPasswordOnStartup: "${ADMIN_RESET_PASSWORD_ON_STARTUP:-false}"

      # An API key for the administrator from the first start, for scripts and AI agents (/mcp).
      Bootstrap__ApiKey: "${ADMIN_API_KEY:-}"

    volumes:
      - site-data:/data

volumes:
  site-data:
